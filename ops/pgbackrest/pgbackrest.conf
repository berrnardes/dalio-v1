# pgBackRest — Phase 7 (DEPLOYMENT.md §3). Repo lives on a Hetzner Storage
# Box over SFTP (pgBackRest ≥2.46 native SFTP repo). Retention: 2 full sets
# keeps ~2 weeks of PITR window at the weekly-full cadence below.
# Secrets (repo1-sftp-* credentials) are injected at deploy time — this file
# documents shape, not credentials.
[global]
repo1-type=sftp
repo1-path=/home/pgbackrest/dalio
repo1-sftp-host=<uXXXXXX>.your-storagebox.de
repo1-sftp-host-user=<uXXXXXX>
repo1-sftp-private-key-file=/etc/pgbackrest/storagebox_ed25519
repo1-sftp-host-key-hash-type=sha256
repo1-retention-full=2
compress-type=zst
start-fast=y
log-level-console=info

[dalio]
pg1-path=/var/lib/postgresql/data
